[package]
name = "rebacd"
description = "The pg_rebac sync daemon: relays relationship writes to SpiceDB and keeps the projection in Postgres"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["postgres", "spicedb", "authorization", "rebac", "permissions"]
categories = ["database", "authentication"]
rust-version.workspace = true

[dependencies]
rebac-schema = { path = "../rebac-schema", version = "0.3.0" }
anyhow = "1"
base64 = "0.22"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
deadpool-postgres = "0.14"
futures = "0.3"
prost = "0.14"
prost-types = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
tokio-postgres = "0.7"
tokio-postgres-rustls = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
webpki-roots = "1"
url = "2"
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
protox = "0.10"
tonic-prost-build = "0.14"


[lints]
workspace = true
